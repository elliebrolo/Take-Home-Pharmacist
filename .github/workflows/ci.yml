name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The project is locked with bun.lock. `npm install` fails on a peer-dependency conflict
      # (esbuild ^0.25 in package.json vs vite's ^0.27 || ^0.28), so install with bun and run the scripts with npm.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Type check
        run: npm run lint
      - name: Tests
        run: npm test
      # Release gate: triage, grounding and validation cases. Any failure blocks the change.
      # Run it again whenever a prompt, model name or keyword list changes.
      - name: Evaluation gate
        run: npm run eval
      - name: Build
        run: npm run build
