name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Tests
        run: npm test
      # Release gate: triage, grounding and validation cases. Any failure blocks the change.
      # Run it again whenever a prompt, model name or keyword list changes.
      - name: Evaluation gate
        run: npm run eval
      - name: Build
        run: npm run build
